<h1>Detyra 1: Krijo një formë me inpute të ndryshme</h1>
<form>
    <label>Emri:</label>
    <input type="text" placeholder="Shkruaj emrin" required>
    <br><br>
    
    <label>Email:</label>
    <input type="email" placeholder="Shkruaj email" required>
    <br><br>
    
    <label>Fjalëkalimi:</label>
    <input type="password" placeholder="Shkruaj fjalëkalimin" required>
    <br><br>
    
    <label>Mosha:</label>
    <input type="number" placeholder="Shkruaj moshën">
    <br><br>
    
    <label>Data e lindjes:</label>
    <input type="date">
    <br><br>
    <label>Koha e takimit:</label>
    <input type="date">
     <input type="time">
    <br><br>
    
    <label>File (Ngarko një skedar):</label>
    <input type="file">
    <br><br>
    <input type="submit" value="Regjistrohu">
    <input type="reset" value="Reset">
</form>

<hr>

<h1>Detyra 2: Krijo një menu drop-down me kater qytete</h1>

    <option>Gjakove</option>

    <option>Prizren</option>
</select>
