<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Dita 5 – UI Zgjidhje</title>
    <link rel="stylesheet" href="dita5_css_ui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<h3>CSS Basics – Detyre UI(User-Interface)</h3>

<!-- Detyra 1 -->
<section class="card profile-card">
    <img src="profile.jpg" alt="Profile" class="profile1">
    <h2>Kebir Qesko</h2>
    <p>Full Stack Developer</p>
    <div class="icons">
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
    </div>
</section>

<!-- Detyra 2 -->
<section class="card product-card">
    <img src="kufje.jpg" alt="Product" class="productimg">
    <h2>Headphones</h2>
    <p class="price">$49.99</p>
    <a href="#" class="btn">Buy Now</a>
</section>

<!-- Detyra 3 -->
<section class="card login-card">
    <h2><i class="fa-solid fa-user"></i> Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button>Login</button>
</section>

<!-- Detyra 4 -->
<section class="info-box success">
    <i class="fa-solid fa-circle-check"></i>
    <strong>Success</strong>
    <p>Your action was successful.</p>
</section>

<!-- Detyra 5 -->
<section class="hero">
    <h2>Welcome to Our Website</h2>
    <p>Learn HTML & CSS with practical UI examples.</p>
    <a href="#" class="btn">Get Started</a>
</section>

</body>
</html>
